<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Loading...</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
            background: #000;
        }

        iframe {
            position: fixed;

            width: 100vw;
            height: 100vh;

            top: 0;
            left: 0;

            border: 0;
        }
    </style>
</head>

<body>

    <iframe
        src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&controls=0&rel=0"
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>

</body>
</html>
