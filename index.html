<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Basic page information -->
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Welcome to the website."
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <title>Welcome</title>


    <!--
        ==========================================
        INSTANT REDIRECT
        ==========================================

        As soon as the page loads, the browser
        redirects to the Rickroll.

        No button is required.
    -->

    <script>

        (function () {

            "use strict";

            const destination =
                "https://www.youtube.com/watch?v=dQw4w9WgXcQ";

            /*
                Redirect immediately after the page
                starts loading.
            */

            window.location.replace(destination);

        })();

    </script>


    <style>

        /* ==========================================
           RESET
           ========================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* ==========================================
           PAGE
           ========================================== */

        html,
        body {

            width: 100%;
            height: 100%;

        }


        body {

            background: #050505;

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;

        }


        /* ==========================================
           BACKGROUND
           ========================================== */

        .background {

            position: fixed;

            inset: 0;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    #222 0%,
                    transparent 30%
                ),

                radial-gradient(
                    circle at 80% 80%,
                    #151515 0%,
                    transparent 30%
                ),

                #050505;

            z-index: -1;

        }


        /* ==========================================
           DECORATIVE CIRCLES
           ========================================== */

        .circle {

            position: absolute;

            border: 1px solid
                rgba(255, 255, 255, 0.08);

            border-radius: 50%;

            animation:
                floating 8s ease-in-out infinite;

        }


        .circle.one {

            width: 500px;

            height: 500px;

            left: -250px;

            top: -250px;

        }


        .circle.two {

            width: 700px;

            height: 700px;

            right: -350px;

            bottom: -350px;

            animation-delay: -3s;

        }


        .circle.three {

            width: 250px;

            height: 250px;

            right: 10%;

            top: 10%;

            animation-delay: -5s;

        }


        @keyframes floating {

            0% {

                transform:
                    translate(0, 0)
                    rotate(0deg);

            }

            50% {

                transform:
                    translate(20px, -25px)
                    rotate(5deg);

            }

            100% {

                transform:
                    translate(0, 0)
                    rotate(0deg);

            }

        }


        /* ==========================================
           MAIN CONTENT
           ========================================== */

        .content {

            width: 90%;

            max-width: 500px;

            padding: 40px;

            text-align: center;

            background:
                rgba(30, 30, 30, 0.85);

            border:
                1px solid
                rgba(255, 255, 255, 0.1);

            border-radius: 20px;

            backdrop-filter: blur(15px);

            box-shadow:
                0 30px 80px
                rgba(0, 0, 0, 0.7);

            animation:
                appear 0.8s ease;

        }


        @keyframes appear {

            from {

                opacity: 0;

                transform:
                    translateY(20px)
                    scale(0.97);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        /* ==========================================
           ICON
           ========================================== */

        .icon {

            width: 70px;

            height: 70px;

            margin:
                0 auto 20px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #191919;

            border:
                1px solid
                rgba(255, 255, 255, 0.1);

            font-size: 30px;

        }


        /* ==========================================
           TITLE
           ========================================== */

        h1 {

            font-size: 28px;

            margin-bottom: 12px;

            font-weight: 700;

        }


        /* ==========================================
           DESCRIPTION
           ========================================== */

        p {

            color: #aaa;

            line-height: 1.6;

            font-size: 14px;

        }


        /* ==========================================
           LOADING
           ========================================== */

        .loading {

            margin-top: 25px;

            font-size: 12px;

            color: #666;

        }


        .loading::after {

            content: "";

            display: inline-block;

            width: 6px;

            height: 6px;

            margin-left: 5px;

            border-radius: 50%;

            background: white;

            animation:
                blink 1s infinite;

        }


        @keyframes blink {

            0%,
            100% {

                opacity: 0.2;

            }

            50% {

                opacity: 1;

            }

        }


        /* ==========================================
           MOBILE
           ========================================== */

        @media (max-width: 600px) {

            .content {

                width: calc(100% - 30px);

                padding: 30px 20px;

                border-radius: 18px;

            }


            h1 {

                font-size: 23px;

            }


            p {

                font-size: 13px;

            }


            .icon {

                width: 60px;

                height: 60px;

                font-size: 25px;

            }

        }

    </style>

</head>


<body>


    <!-- ==========================================
         BACKGROUND ELEMENTS
         ========================================== -->

    <div class="background">

        <div class="circle one"></div>

        <div class="circle two"></div>

        <div class="circle three"></div>

    </div>


    <!-- ==========================================
         MAIN PAGE
         ========================================== -->

    <main class="content">

        <div class="icon">

            🌐

        </div>


        <h1>

            Welcome

        </h1>


        <p>

            Preparing your experience...

        </p>


        <div class="loading">

            Loading

        </div>

    </main>


    <!-- ==========================================
         FALLBACK
         ========================================== -->

    <noscript>

        <meta
            http-equiv="refresh"
            content="0;url=https://www.youtube.com/watch?v=dQw4w9WgXcQ"
        >

    </noscript>


</body>

</html>
