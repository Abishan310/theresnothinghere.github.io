<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

video {
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    display: block;
}
</style>
</head>

<body>

<video id="video" autoplay muted playsinline preload="auto">
    <source src="https://res.cloudinary.com/dr3i5yie/video/upload/v1789162084/YTDown.com_YouTube_Rick-Astley-Never-Gonna-Give-You-Up-Offi_Media_dQw4w9WgXcQ_001_1080p.mp4" type="video/mp4">
</video>

<script>
const video = document.getElementById("video");

// Autoplay immediately (muted)
video.play().catch(() => {});

// First click/tap:
// - turns sound on
// - enters browser fullscreen
async function startFullscreen() {
    video.muted = false;

    try {
        await video.play();
    } catch (e) {}

    try {
        if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
        }
    } catch (e) {}
}

document.addEventListener("click", startFullscreen, { once: true });
document.addEventListener("touchstart", startFullscreen, { once: true });
</script>

</body>
</html>
