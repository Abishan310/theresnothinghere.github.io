<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

video {
    width: 100vw;
    height: 100vh;
    object-fit: cover;
}
</style>
</head>

<body>

<video id="video" autoplay muted playsinline preload="auto">
    <source src="https://res.cloudinary.com/dr3i5yie/video/upload/v1789073542/YTDown.com_YouTube_Rick-Astley-Never-Gonna-Give-You-Up-Offi_Media_dQw4w9WgXcQ_001_1080p.mp4" type="video/mp4">
</video>

<script>
const video = document.getElementById("video");

// Autoplay immediately
video.play().catch(() => {});

// First interaction enables sound
function enableSound() {
    video.muted = false;
    video.play().catch(() => {});
}

document.addEventListener("click", enableSound, { once: true });
document.addEventListener("touchstart", enableSound, { once: true });
</script>

</body>
</html>
